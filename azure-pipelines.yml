trigger:
- none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: 'New variable group 30-Dec'
- group: 'nexus-secrets'


stages:

# =========================================================
# STAGE 1: LINTING
# =========================================================
- stage: Linting
  displayName: 'Stage 1 - Linting'
  jobs:
  - job: LintFrontend
    displayName: 'Lint Frontend'
    steps:

    # -----------------------------
    # Task 1: Install linters
    # -----------------------------
    - script: |
        npm install -g @biomejs/biome
      displayName: 'Install Biome & Pylint'
    
    # -----------------------------
    # Task 2: Run Biome (Frontend)
    # -----------------------------
    - script: |
        echo "Running Biome (Frontend)"
        cd frontend
        biome check .
      displayName: 'Lint Frontend (Biome)' 

  - job: LintBackend
    displayName: 'Lint Backend'
    steps: 
    # -----------------------------
    # Task 3: Run Pylint (Backend)
    # -----------------------------
    - script: |
        cd backend/get-task
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        pip install pylint
        python -m pylint app.py --fail-under=9
        deactivate
      displayName: 'Lint Backend(Pylint---gettask)'    
    
    - script: |
        cd backend/add-task
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        pip install pylint
        python -m pylint app.py --fail-under=9
      displayName: 'Lint Backend(Pylint---addtask)'

# =========================================================
# STAGE 2: UNIT TESTS & COVERAGE
# =========================================================
- stage: Tests
  displayName: 'Stage 2 - Unit Tests & Coverage'
  dependsOn: Linting
  jobs:

  # -------------------------------------------------------
  # JOB 1: FRONTEND - VITEST + COVERAGE
  # -------------------------------------------------------
  - job: Frontend_Tests
    displayName: 'Frontend Unit Tests & Coverage'
    steps:
    
    - task: NodeTool@0
      displayName: 'Use Node.js 20'
      inputs:
        versionSource: 'spec'
        versionSpec: '20.x'
        checkLatest: true

    - script: |
        cd frontend
        npm ci
        npm install
        npm run test:ci -- \
        --reporter=default \
        --reporter=junit \
        --outputFile=test-results/junit.xml
      displayName: 'Run Vitest & Coverage'

    - task: PublishTestResults@2
      displayName: 'Publish Frontend Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'frontend/test-results/junit.xml'
        testRunTitle: 'Frontend Vitest Tests'
      condition: always()
    
    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: 'frontend/coverage/cobertura-coverage.xml'
        reportDirectory: 'frontend/coverage'
      condition: always()
    
  # -------------------------------------------------------
  # JOB 2: BACKEND - PYTEST + COVERAGE
  # -------------------------------------------------------
  - job: Backend_Tests
    displayName: 'Backend Unit Tests & Coverage'
    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
        addToPath: true

    - script: |
        # -------- get-task --------
        cd backend/get-task
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        pip install pytest pytest-cov
        pytest \
        --junitxml=test-results.xml \
        --cov=app \
        --cov-report=xml:coverage.xml \
        --cov-report=term \
        --cov-fail-under=80
        deactivate
      displayName: 'get-task test and coverage'
    
    - task: PublishTestResults@2
      displayName: 'Publish Backend get-task Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'backend/get-task/test-results.xml'
        testRunTitle: 'Backend get-task Pytest'
      condition: always()
    
    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Backend get-task Coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: 'backend/get-task/coverage.xml'
        reportDirectory: 'backend/get-task'
      condition: always()

    - script: |
        # -------- add-task --------
        cd backend/add-task
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        pip install pytest pytest-cov
        pytest \
        --junitxml=test-results.xml \
        --cov=app \
        --cov-report=xml:coverage.xml \
        --cov-report=term \
        --cov-fail-under=80
        deactivate
      displayName: 'add-task test and coverage'

    - task: PublishTestResults@2
      displayName: 'Publish Backend add-task Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'backend/add-task/test-results.xml'
        testRunTitle: 'Backend add-task Pytest'
      condition: always()
    
    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Backend add-task Coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: 'backend/add-task/coverage.xml'
        reportDirectory: 'backend/add-task'
      condition: always()

# =========================================================
# STAGE 3: Secret Scanning
# =========================================================
- stage: SecretScan
  displayName: 'Stage 3 - Secret Scanning'
  jobs:

  # ==================================
  # JOB 1: TruffleHog (Deep Git Scan)
  # ==================================
  - job: TruffleHogScan
    displayName: 'TruffleHog – Secret Scan'
    steps:
    - checkout: self
      fetchDepth: 0   # IMPORTANT: full git history

    - script: |
        echo "Installing TruffleHog..."
        TRUFFLEHOG_VERSION="3.92.4"
        TRUFFLEHOG_URL="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
        curl -L "$TRUFFLEHOG_URL" -o trufflehog.tar.gz
        tar -xzf trufflehog.tar.gz
        sudo mv trufflehog /usr/local/bin/
        trufflehog --version
      displayName: 'Install TruffleHog'

    - script: |
        echo "Running TruffleHog git history scan..."
        trufflehog git file://$(Build.SourcesDirectory) --no-update
      displayName: 'Run TruffleHog Scan'
  
  # ==================================
  # JOB 2: Gitleaks (Fast Git Scan)
  # ==================================

  - job: GitleaksScan
    displayName: 'Gitleaks – Secret Scan'
    dependsOn: TruffleHogScan
    steps:
    - checkout: self
      fetchDepth: 0   # full git history

    - script: |
        echo "Installing Gitleaks..."
        GITLEAKS_VERSION="8.21.0"
        curl -L https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz -o gitleaks.tar.gz
        tar -xzf gitleaks.tar.gz
        sudo mv gitleaks /usr/local/bin/
        gitleaks version
      displayName: 'Install Gitleaks'

    - script: |
        echo "Running Gitleaks git scan..."
        gitleaks detect \
          --source . \
          --exit-code 1
      displayName: 'Run Gitleaks Scan'

# ==========================================================
# STAGE 4: SCA Scan (Snyk - Docker)
# ==========================================================
- stage: SCAScan
  displayName: 'Stage 4 - SCA Scan (Snyk)'
  dependsOn: SecretScan
  condition: succeeded()

  jobs:
    - job: SnykSCAScan
      displayName: 'Snyk – Dependency Vulnerability Scan'
      steps:
        - checkout: self

        # ---------- Frontend ----------
        - script: |
            docker run --rm \
              -e SNYK_TOKEN=$SNYK_TOKEN \
              -v $(System.DefaultWorkingDirectory):/project \
              -w /project/frontend \
              snyk/snyk:node \
              snyk test --severity-threshold=critical --org=$SNYK_ORG_ID
          displayName: 'Snyk SCA – Frontend'
          env:
            SNYK_TOKEN: $(SNYK_TOKEN)
            SNYK_ORG_ID: $(SNYK_ORG_ID)

        # ---------- Backend add-task ----------
        - script: |
            docker run --rm \
              -e SNYK_TOKEN=$SNYK_TOKEN \
              -v $(System.DefaultWorkingDirectory):/project \
              -w /project/backend/add-task \
              snyk/snyk:python \
              snyk test --severity-threshold=critical --org=$SNYK_ORG_ID
          displayName: 'Snyk SCA – Backend add-task'
          env:
            SNYK_TOKEN: $(SNYK_TOKEN)
            SNYK_ORG_ID: $(SNYK_ORG_ID)

        # ---------- Backend get-task ----------
        - script: |
            docker run --rm \
              -e SNYK_TOKEN=$SNYK_TOKEN \
              -v $(System.DefaultWorkingDirectory):/project \
              -w /project/backend/get-task \
              snyk/snyk:python \
              snyk test --severity-threshold=critical --org=$SNYK_ORG_ID
          displayName: 'Snyk SCA – Backend get-task'
          env:
            SNYK_TOKEN: $(SNYK_TOKEN)
            SNYK_ORG_ID: $(SNYK_ORG_ID)

# ==========================================================
# STAGE 5: SCA Scan (Snyk) – CLI (No Docker)
# ==========================================================
- stage: SCAScans
  displayName: 'Stage 5 - SCA Scan (Snyk)'
  dependsOn: SecretScan
  condition: succeeded()

  jobs:
    - job: SnykSCAScan
      displayName: 'Snyk – Dependency Vulnerability Scan'
      steps:
        - checkout: self

        # -----------------------------------
        # Install Snyk CLI
        # -----------------------------------
        - script: |
            npm install -g snyk
            snyk --version
          displayName: 'Install Snyk CLI'

        # -----------------------------------
        # SCA Scan – Frontend (Node.js)
        # -----------------------------------
        - script: |
            cd frontend
            snyk test \
              --severity-threshold=critical \
              --org=$SNYK_ORG_ID
          displayName: 'Snyk SCA – Frontend'
          env:
            SNYK_TOKEN: $(SNYK_TOKEN)
            SNYK_ORG_ID: $(SNYK_ORG_ID)

        # -----------------------------------
        # SCA Scan – Backend (add-task)
        # -----------------------------------
        - script: |
            cd backend/add-task
            pip install -r requirements.txt
            snyk test \
              --severity-threshold=critical \
              --org=$SNYK_ORG_ID
          displayName: 'Snyk SCA – Backend add-task'
          env:
            SNYK_TOKEN: $(SNYK_TOKEN)
            SNYK_ORG_ID: $(SNYK_ORG_ID)

        # -----------------------------------
        # SCA Scan – Backend (get-task)
        # -----------------------------------
        - script: |
            cd backend/get-task
            pip install -r requirements.txt
            snyk test \
              --severity-threshold=critical \
              --org=$SNYK_ORG_ID
          displayName: 'Snyk SCA – Backend get-task'
          env:
            SNYK_TOKEN: $(SNYK_TOKEN)
            SNYK_ORG_ID: $(SNYK_ORG_ID)

# ==========================================================
# STAGE 6: SCA Scan (Snyk) – With Auth
# ==========================================================
- stage: SCAScanss
  displayName: 'Stage 6 - SCA Scan (Snyk)'
  dependsOn: SecretScan
  condition: succeeded()

  jobs:
    - job: SnykSCAScan
      displayName: 'Snyk – Dependency Vulnerability Scan'

      steps:
        - checkout: self

        # -----------------------------------
        # Install Snyk CLI
        # -----------------------------------
        - script: |
            npm install -g snyk
            snyk --version
          displayName: 'Install Snyk CLI'

        # -----------------------------------
        # Authenticate Snyk (Token-based)
        # -----------------------------------
        - script: |
            echo "Authenticating Snyk using API token..."
            snyk auth "$SNYK_TOKEN"
          displayName: 'Authenticate Snyk'
          env:
            SNYK_TOKEN: $(SNYK_TOKEN)

        # -----------------------------------
        # SCA Scan – Frontend
        # -----------------------------------
        - script: |
            cd frontend
            snyk test \
              --severity-threshold=critical \
              --org=$SNYK_ORG_ID
          displayName: 'Snyk SCA – Frontend'
          env:
            SNYK_TOKEN: $(SNYK_TOKEN)
            SNYK_ORG_ID: $(SNYK_ORG_ID)

        # -----------------------------------
        # SCA Scan – Backend (add-task)
        # -----------------------------------
        - script: |
            cd backend/add-task
            pip install -r requirements.txt
            snyk test \
              --severity-threshold=critical \
              --org=$SNYK_ORG_ID
          displayName: 'Snyk SCA – Backend add-task'
          env:
            SNYK_TOKEN: $(SNYK_TOKEN)
            SNYK_ORG_ID: $(SNYK_ORG_ID)

        # -----------------------------------
        # SCA Scan – Backend (get-task)
        # -----------------------------------
        - script: |
            cd backend/get-task
            pip install -r requirements.txt
            snyk test \
              --severity-threshold=critical \
              --org=$SNYK_ORG_ID
          displayName: 'Snyk SCA – Backend get-task'
          env:
            SNYK_TOKEN: $(SNYK_TOKEN)
            SNYK_ORG_ID: $(SNYK_ORG_ID)

# ==========================================================
# STAGE 7: SAST Scan (SonarQube)
# ==========================================================
- stage: SASTScan
  displayName: 'Stage 7 - SAST Scan (SonarQube)'
  dependsOn: SCAScan
  condition: succeeded()

  jobs:
    - job: SonarQubeSAST
      displayName: 'SonarQube – Static Code Analysis'
      pool:
        name: apforge_agents   # Windows self-hosted agent

      steps:
        - checkout: self

        # -----------------------------------
        # Install SonarScanner (SIMPLE)
        # -----------------------------------
        
        # -----------------------------------
        # Run SonarQube Scan
        # -----------------------------------
        - task: PowerShell@2
          displayName: 'Run SonarQube Scan'
          inputs:
            targetType: 'inline'
            script: 'sonar-scanner.bat -Dsonar.projectKey=sentioar-monolithic-ado -Dsonar.sources=. -Dsonar.host.url=$(SONAR_HOST_URL) -Dsonar.token=$(SONAR_TOKEN)'
# ==========================================================
# STAGE 8: Build Artifacts
# ==========================================================
- stage: BuildArtifacts
  displayName: 'Stage 8 - Build Artifacts'
  dependsOn: SASTScan
  condition: succeeded()

  jobs:
    - job: BuildArtifacts
      displayName: 'Build & Publish Artifacts'
      steps:
        - checkout: self

        # -----------------------------
        # Frontend Build (Vite / React)
        # -----------------------------
        - script: |
            cd frontend
            npm install
            npm ci
            npm run build
          displayName: 'Build Frontend'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish Frontend Artifact'
          inputs:
            PathtoPublish: 'frontend/dist'
            ArtifactName: 'frontend-drop'
            publishLocation: 'Container'

        # -----------------------------
        # Backend add-task Artifact
        # -----------------------------
        - task: PublishBuildArtifacts@1
          displayName: 'Publish Backend add-task Artifact'
          inputs:
            PathtoPublish: 'backend/add-task'
            ArtifactName: 'backend-add-task'
            publishLocation: 'Container'

        # -----------------------------
        # Backend get-task Artifact
        # -----------------------------
        - task: PublishBuildArtifacts@1
          displayName: 'Publish Backend get-task Artifact'
          inputs:
            PathtoPublish: 'backend/get-task'
            ArtifactName: 'backend-get-task'
            publishLocation: 'Container'

# ==========================================================
# STAGE 9: Publish Artifacts to Nexus OSS
# ==========================================================            

- stage: PublishToNexus
  displayName: 'Stage 9 - Publish Artifacts to Nexus (Windows)'
  dependsOn: BuildArtifacts
  condition: succeeded()

  jobs:
    - job: NexusUpload
      displayName: 'Upload Artifacts to Nexus OSS'
      pool:
        name: apforge_agents   # Windows self-hosted agent

      steps:
        - checkout: none

        # -----------------------------
        # Download Artifacts
        # -----------------------------
        - task: DownloadBuildArtifacts@0
          inputs:
            artifactName: frontend-drop
            downloadPath: $(Pipeline.Workspace)

        - task: DownloadBuildArtifacts@0
          inputs:
            artifactName: backend-add-task
            downloadPath: $(Pipeline.Workspace)

        - task: DownloadBuildArtifacts@0
          inputs:
            artifactName: backend-get-task
            downloadPath: $(Pipeline.Workspace)

        # -----------------------------
        # Upload Frontend Artifact
        # -----------------------------
        - powershell: |
            $ErrorActionPreference = "Stop"

            cd "$(Pipeline.Workspace)\frontend-drop"

            Compress-Archive -Path * -DestinationPath frontend-dist.zip -Force

            curl.exe -u "$(NEXUS_USER):$(NEXUS_PASSWORD)" `
              -T frontend-dist.zip `
              "$(NEXUS_URL)/repository/$(NEXUS_FRONTEND_REPO)/frontend/frontend-$(Build.BuildId).zip"
          displayName: 'Upload Frontend Artifact to Nexus'

        # -----------------------------
        # Upload Backend add-task
        # -----------------------------
        - powershell: |
            cd "$(Pipeline.Workspace)\backend-add-task"

            Compress-Archive -Path * -DestinationPath backend-add-task.zip -Force

            curl.exe -u "$(NEXUS_USER):$(NEXUS_PASSWORD)" `
              -T backend-add-task.zip `
              "$(NEXUS_URL)/repository/$(NEXUS_BACKEND_REPO)/backend/add-task-$(Build.BuildId).zip"
          displayName: 'Upload Backend add-task Artifact'

        # -----------------------------
        # Upload Backend get-task
        # -----------------------------
        - powershell: |
            cd "$(Pipeline.Workspace)\backend-get-task"

            Compress-Archive -Path * -DestinationPath backend-get-task.zip -Force

            curl.exe -u "$(NEXUS_USER):$(NEXUS_PASSWORD)" `
              -T backend-get-task.zip `
              "$(NEXUS_URL)/repository/$(NEXUS_BACKEND_REPO)/backend/get-task-$(Build.BuildId).zip"
          displayName: 'Upload Backend get-task Artifact'
